name: Build

# - Every push and pull request: run the tests, build the .exe, portable zip and installer,
#   and keep them as workflow artifacts (Actions tab → run → Artifacts) for 14 days.
# - Pushing a tag like v0.2.0: the same, then publish a GitHub Release with the files.
#   The tag must match __version__ in src/subtrack/__init__.py.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import subtrack; print(subtrack.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match __version__ $version. Update src/subtrack/__init__.py or the tag."
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build exe, portable zip and installer
        shell: pwsh
        run: ./build.ps1 -SkipTests -RequireInstaller -Python python

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SubTrack-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Public repo that installed copies check for updates (src/subtrack/services/updater.py).
      PUBLIC_REPO: Sunless19/subtrack-releases
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Pick release notes
        id: notes
        run: |
          # release-notes/<tag>.md if it exists, otherwise a short default.
          file="release-notes/${{ github.ref_name }}.md"
          if [ ! -f "$file" ]; then
            file="$RUNNER_TEMP/notes.md"
            echo "SubTrack ${{ github.ref_name }}. Download **SubTrack-*-setup.exe** to install or update." > "$file"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (this repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "SubTrack ${{ github.ref_name }}" \
            --notes-file "${{ steps.notes.outputs.file }}"

      - name: Publish to the public releases repo (automatic updates)
        env:
          # Fine-grained token with "Contents: read and write" on the public repo only.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASES_TOKEN secret is not set, so installed copies will not see this version. See README → Releasing."
            exit 0
          fi
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "$PUBLIC_REPO" \
            --title "SubTrack ${{ github.ref_name }}" \
            --notes-file "${{ steps.notes.outputs.file }}"
